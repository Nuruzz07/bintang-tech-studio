<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Bintang Tech Studio — Platform Sewa Bot Commerce Multi-Tenant</title>
    <meta
      name="description"
      content="Sewa bot WhatsApp dan Telegram untuk jualan produk digital otomatis 24 jam dengan integrasi QRIS dan auto-fulfillment instan."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              linear: {
                bg: '#0a0a0c',
                card: '#121316',
                border: '#22232a',
                borderHover: '#33353f',
                muted: '#8a8f98',
                subtext: '#666970',
                purple: '#5e6ad2',
                purpleHover: '#717cd8',
              },
              ray: {
                dark: '#050507',
                card: '#121215',
                border: '#27272a',
                hover: '#18181c',
                text: '#a1a1aa',
                light: '#fafafa',
              },
              resend: {
                bg: '#0a0a0a',
                card: '#0f0f0f',
                border: '#222222',
                borderHover: '#333333',
                muted: '#888888',
                btn: '#1c1c1c',
                btnHover: '#262626',
              },
            },
            fontFamily: {
              sans: [
                'Inter',
                '-apple-system',
                'BlinkMacSystemFont',
                'Segoe UI',
                'Roboto',
                'sans-serif',
              ],
              mono: [
                'JetBrains Mono',
                'SFMono-Regular',
                'Menlo',
                'Monaco',
                'Consolas',
                'monospace',
              ],
            },
          },
        },
      };
    </script>

    <!-- Local Styles -->
    <link rel="stylesheet" href="./src/styles/design-tokens.css" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body
    class="bg-[#08090b] text-[#f8fafc] min-h-screen flex flex-col antialiased selection:bg-terracotta-500 selection:text-white"
  >
    <!-- Global Top Demo Switcher Bar -->
    <div id="demo-navbar-container"></div>

    <!-- Main View Render Target -->
    <div id="app-root" class="flex-1"></div>

    <!-- Toast Container -->
    <div
      id="toast-container"
      class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4"
    ></div>

    <!-- Application Main Script -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
